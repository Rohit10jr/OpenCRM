# Ruff, the Python linter run by .github/workflows/backend.yml (`ruff check .` in backend/).
#
# Real mistakes only, no style: pyflakes (F: undefined names, unused imports and
# variables, redefinitions) and pycodestyle's error classes E4 (imports), E7 (statements)
# and E9 (syntax). The rule list is spelled out rather than left to Ruff's default, which
# grew to cover hundreds of style rules in 0.17. Formatting stays untouched: much of this
# code follows upstream's layout, and reformatting it would bury real changes in diffs.

target-version = "py313"
extend-exclude = ["scratch", "media"]

[lint]
select = ["F", "E4", "E7", "E9"]

[lint.per-file-ignores]
# The settings modules build on each other with `from .base import *`, Django's usual
# pattern, so names arrive through the star import.
"config/settings/*.py" = ["F403", "F405"]
