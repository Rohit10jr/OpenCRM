[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = tests
addopts = -q --strict-markers
# Phase 6. WebsocketCommunicator is a coroutine; without an asyncio mode pytest collects
# those tests, does not await them, and reports them as passed. `strict` keeps that
# explicit - a coroutine test without @pytest.mark.asyncio is an error, not a silent skip.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
