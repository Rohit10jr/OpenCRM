# backend_v2 CI: Ruff, Django checks, missing migrations, and the full pytest suite.
#
# The rebuild lives on `django-rebuild`, and its milestone pull requests target that
# branch, so this runs on pull requests into it and pushes to it (and to main, once the
# rebuild merges). A newer push to the same pull request cancels the run still going.
#
# As in backend.yml, the workflow always starts and the `changes` job decides whether
# the tests run — only when backend_v2/ or this file changed — so a required check never
# waits forever on a skipped workflow.
#
# Services: PostgreSQL 17 (the test database is created by Django as test_opencrm_v2)
# and Redis, on the databases backend_v2 uses (REBUILD_PLAN section 7: 4 cache,
# 5 broker, 6 results, 7 channels). The test settings swap the cache and channel layer
# for in-memory ones; Redis is here for the code paths that reach it directly.

name: Backend v2

on:
  push:
    branches: [django-rebuild, main]
  pull_request:
    branches: [django-rebuild, main]

concurrency:
  group: backend-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: backend_v2 changed?
    runs-on: ubuntu-latest
    outputs:
      backend_v2: ${{ steps.filter.outputs.backend_v2 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend_v2:
              - "backend_v2/**"
              - ".github/workflows/backend_v2.yml"

  tests:
    name: Checks and tests
    needs: changes
    if: needs.changes.outputs.backend_v2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencrm_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NAME: opencrm_v2
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      CACHE_URL: redis://localhost:6379/4
      CELERY_BROKER_URL: redis://localhost:6379/5
      CELERY_RESULT_BACKEND: redis://localhost:6379/6
      CHANNEL_LAYER_URL: redis://localhost:6379/7

    defaults:
      run:
        working-directory: backend_v2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend_v2/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ruff's default rules: real mistakes only (unused imports, undefined names, syntax).
      - name: Ruff
        run: ruff check --output-format=github .

      - name: Django system checks
        run: python manage.py check

      # Under both settings: the test settings also install the test-only app and its
      # migrations. (DJANGO_SETTINGS_MODULE above is the test one, hence the explicit flag.)
      - name: No missing migrations
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings.local
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Test suite
        run: python -m pytest -n auto -p no:cacheprovider -rfE
