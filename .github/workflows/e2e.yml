# Browser tests: the Playwright suite (frontend/tests/e2e/) against a fresh database.
#
# Not on every pull request: it is the slowest check, and the owner chose a manual and
# nightly run (6 Nov 2026). It also runs on a pull request that changes this file, the
# tests, the Playwright config or the Vite config the dev server runs on, so a change to
# the suite or to how it is served is tried before it merges. GitHub runs a scheduled workflow
# from main only, and turns the schedule off after 60 days without a commit to the
# repository.
#
# The database starts empty. `migrate` and `seed_defaults` write the roles and the
# reference rows the screens need (statuses, layouts, form scripts, the user menu), and
# `seed_e2e_users` gives Administrator and ada@example.com the passwords the tests sign
# in with, generated fresh for each run. No test expects demo records; the ones that
# need rows make and delete their own.
#
# Django runs with the test settings, which keep the cache, the channel layer and
# Celery in memory, so no Redis is needed (the login lockout reads the cache, so the
# ordinary settings would fail every sign-in without it). Playwright starts `yarn dev`
# on 8080 itself, and the browser reaches Django through Vite's proxy.

name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "frontend/tests/e2e/**"
      - "frontend/playwright.config.js"
      - "frontend/vite.config.js"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opencrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NAME: opencrm
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      # The whole run reuses the one sign-in auth.setup.js saves; at the default five
      # minutes its access token would expire part-way and send later tests to login.
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "120"
      CI: "true"
      # Without it Python buffers runserver's output in a file, and the uploaded
      # django.log of the first run came out empty.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Generate the test passwords
        run: |
          for key in ADMIN_PWD SALES_PWD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare the database
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_defaults
          python manage.py seed_e2e_users

      # On [::] so both 127.0.0.1 and ::1 reach it: Vite's proxy sends each request to
      # the browser's host name, `localhost`, which may resolve to either.
      - name: Start Django
        working-directory: backend
        run: |
          nohup python manage.py runserver --ipv6 "[::]:8000" --noreload > "$RUNNER_TEMP/django.log" 2>&1 &
          curl --silent --output /dev/null --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install the frontend
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: yarn test:e2e

      - name: Keep the report and the server log
        if: failure()
        run: |
          mkdir -p frontend/playwright-report
          cp "$RUNNER_TEMP/django.log" frontend/playwright-report/ || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
