# Secret scan: gitleaks over the whole git history.
#
# Runs on every pull request into main and every push to main. The repository is public,
# so a password, key or token committed once stays readable in its history even after a
# later commit deletes it; this check looks at every commit, not just the new ones, and
# fails if it finds one. Findings are printed with the secret redacted.
#
# gitleaks is the release binary, pinned by version and by the SHA-256 that release
# publishes (gitleaks_8.30.1_checksums.txt), not a marketplace action. To bump it,
# change both lines from the new release's checksums file.

name: Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          rm "$tarball"

      - name: Scan the git history
        run: ./gitleaks git --redact --verbose --no-banner .
