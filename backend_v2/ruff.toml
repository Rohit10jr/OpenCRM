# Ruff, the Python linter run by .github/workflows/backend_v2.yml (`ruff check .` here).
#
# The same rules as backend/ruff.toml: real mistakes only, no style — pyflakes (F:
# undefined names, unused imports and variables, redefinitions) and pycodestyle's error
# classes E4 (imports), E7 (statements) and E9 (syntax). Spelled out because Ruff's own
# default grew to cover hundreds of style rules in 0.17.

target-version = "py313"

[lint]
select = ["F", "E4", "E7", "E9"]

[lint.per-file-ignores]
# The settings modules build on each other with `from .base import *`, Django's usual
# pattern, so names arrive through the star import.
"config/settings/*.py" = ["F403", "F405"]
